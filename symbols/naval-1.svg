<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 40" width="80" height="40">
  <!-- Hull -->
  <polygon points="4,28 12,34 68,34 76,28 70,24 10,24" fill="white"/>
  <!-- Superstructure -->
  <rect x="24" y="16" width="28" height="8" rx="1" fill="white"/>
  <!-- Bridge -->
  <rect x="30" y="10" width="14" height="7" rx="1" fill="white"/>
  <!-- Mast -->
  <rect x="36" y="3" width="2" height="8" fill="white"/>
  <!-- Radar crossbar -->
  <rect x="32" y="4" width="10" height="1.5" rx="0.5" fill="white"/>
  <!-- Forward gun turret -->
  <rect x="54" y="19" width="8" height="4" rx="1.5" fill="white"/>
  <!-- Forward barrel (longer, tilted up, pivots from turret) -->
  <rect x="62" y="20" width="8" height="2" rx="0.5" fill="white" transform="rotate(-20,62,21)"/>
  <!-- Aft gun turret -->
  <rect x="14" y="19" width="8" height="4" rx="1.5" fill="white"/>

  <!-- Funnel -->
  <rect x="44" y="12" width="5" height="5" rx="1" fill="white"/>
</svg>
