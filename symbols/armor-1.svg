<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="64" height="40">
  <defs>
    <mask id="track-mask">
      <rect width="64" height="40" fill="white"/>
      <circle cx="14" cy="27" r="2.5" fill="black"/>
      <circle cx="24" cy="27" r="2.5" fill="black"/>
      <circle cx="34" cy="27" r="2.5" fill="black"/>
      <circle cx="46" cy="27" r="2.5" fill="black"/>
    </mask>
  </defs>
  <!-- Tracks with wheel cutouts -->
  <rect x="6" y="23" width="48" height="8" rx="4" fill="white" mask="url(#track-mask)"/>
  <!-- Hull -->
  <polygon points="8,23 14,17 50,17 54,23" fill="white"/>
  <!-- Turret -->
  <rect x="20" y="11" width="18" height="7" rx="2" fill="white"/>
  <!-- Barrel -->
  <rect x="38" y="13" width="18" height="3" rx="1" fill="white" transform="rotate(-15,38,14.5)"/>
  <!-- Hatch -->
  <rect x="27" y="9" width="6" height="3" rx="1.5" fill="white"/>
</svg>
