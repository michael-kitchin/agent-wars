# Build and test Agent Wars on Windows, Linux, and macOS.
# Runs on push and pull_request to main. Uploads release artifacts per OS.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --win -c.build.publish=null

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --linux -c.build.publish=null && node scripts/post-linux-pack.js

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --mac -c.build.publish=null

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-wars-m0.5-${{ runner.os }}
          path: release/
