# Build and test Agent Wars on Windows, Linux, and macOS.
# Runs on push and pull_request to main. Uploads release artifacts per OS.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Used by scripts/extract-generated-data.cjs (npm run build / test). Linux runners often lack `python`; setup-python provides it.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: app_version
        run: node -e "const fs=require('fs');const v=require('./package.json').version;fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value='+v+String.fromCharCode(10));"

      - name: Run tests
        run: npm run test

      - name: Rebuild better-sqlite3 for Electron (packaging)
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --win dir --publish never

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --linux AppImage --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --mac zip --publish never

      - name: Remove intermediate build outputs
        shell: bash
        run: |
          rm -f release/builder-debug.yml
          rm -f release/builder-effective-config.yaml
          rm -rf release/linux-unpacked
          rm -rf release/mac

      - name: Upload release artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: agent-wars-${{ steps.app_version.outputs.value }}-${{ runner.os }}
          path: release/win-unpacked/*

      - name: Upload release artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: agent-wars-${{ steps.app_version.outputs.value }}-${{ runner.os }}
          path: release/
