# Build and test Agent Wars on Windows, Linux, and macOS.
# Runs on push and pull_request to main. Uploads release artifacts per OS.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run dist:mac

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/
