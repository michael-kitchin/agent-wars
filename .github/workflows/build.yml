# Build and test Agent Wars on Windows, Linux, and macOS.
# On-demand only (workflow_dispatch). Uploads release artifacts per OS.
# Artifact names embed the app version from package.json ("version"), via the "Read app version" step.
name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Used by scripts/extract-generated-data.cjs (npm run build / test). Linux runners often lack `python`; setup-python provides it.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # npm ci --ignore-scripts skips electron's postinstall download.
      # Some node-side tests import modules that depend on `electron`, so we
      # install Electron's binary explicitly before test execution.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # Fail fast when postinstall was skipped (`npm ci --ignore-scripts`) but the binary is still missing.
      - name: Verify Electron binary
        shell: bash
        run: |
          test -f node_modules/electron/path.txt
          node -e "const fs=require('fs');const path=require('path');const p=path.join('node_modules/electron','dist',fs.readFileSync('node_modules/electron/path.txt','utf8').trim());if(!fs.existsSync(p)){console.error('Electron binary missing at',p);process.exit(1)}"

      - name: Rebuild better-sqlite3 for Node (tests)
        run: npm run rebuild:native:node

      - name: Read app version
        id: app_version
        run: node -e "const fs=require('fs');const v=require('./package.json').version;fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value='+v+String.fromCharCode(10));"

      # `npm run test` runs `npm run lint` after `build:main` (see package.json).
      - name: Run tests
        run: npm run test

      - name: Rebuild better-sqlite3 for Electron (packaging)
        run: npm run rebuild:native:electron

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --win dir --publish never

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --linux dir --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run clean:release && npm run build && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --mac dir --publish never

      - name: Remove intermediate build outputs
        shell: bash
        run: |
          rm -f release/builder-debug.yml
          rm -f release/builder-effective-config.yaml

      - name: Upload release artifacts (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-wars-${{ steps.app_version.outputs.value }}-${{ runner.os }}
          path: release/win-unpacked/*

      - name: Upload release artifacts (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-wars-${{ steps.app_version.outputs.value }}-${{ runner.os }}
          path: release/linux-unpacked/*

      - name: Upload release artifacts (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-wars-${{ steps.app_version.outputs.value }}-${{ runner.os }}
          path: release/mac*/*
