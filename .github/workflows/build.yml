# Build and test Agent Wars on Windows, Linux, and macOS.
# On-demand only (workflow_dispatch). Windows uploads the unpacked app as
# agent-wars-<version>-windows-<arch>; that artifact is the zip. Linux and macOS
# upload an archive made on the runner, because the artifact upload drops Unix
# permissions and follows symlinks.
# With "Create a draft release" checked, a last job attaches the archives and
# SHA256SUMS.txt to a draft GitHub release v<version>, with notes from
# doc/release-notes/v<version>.md. Publishing the draft stays a manual step.
# The procedure is in doc/releasing.md.
name: Build

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Create a draft release from this commit"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Used by scripts/extract-generated-data.cjs (npm run build / test). Linux runners often lack `python`; setup-python provides it.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Node (tests)
        run: npm run rebuild:native:node

      - name: Read app version
        id: app_version
        run: node -e "const fs=require('fs');const v=require('./package.json').version;fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value='+v+String.fromCharCode(10));"

      # `npm run test` runs `npm run lint` after `build:main` (see package.json).
      - name: Run tests
        run: npm run test

      # npm ci --ignore-scripts skips electron's postinstall download; tests do not require the binary.
      - name: Install Electron binary
        run: node scripts/install-electron-binary.cjs

      - name: Rebuild better-sqlite3 for Electron (packaging)
        run: npm run rebuild:native:electron

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run clean:release && npm run build && npm run generated:assert-pack-ready && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --win dir --publish never

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run clean:release && npm run build && npm run generated:assert-pack-ready && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --linux dir --publish never

      # Unsigned side-load builds: disable keychain auto-discovery so macOS runners
      # do not fail looking for a Developer ID identity that CI does not provide.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run clean:release && npm run build && npm run generated:assert-pack-ready && node node_modules/electron-builder/cli.js --config electron-builder.config.cjs --mac dir --publish never

      - name: Assert packaged terrain JSON
        run: npm run generated:assert-packaged

      - name: Remove intermediate build outputs
        shell: bash
        run: |
          rm -f release/builder-debug.yml
          rm -f release/builder-effective-config.yaml

      # Apple silicon will not launch an app without a valid signature, and an ad-hoc
      # signature is enough for a side-load build. Keep electron-builder's signature
      # when it verifies; otherwise sign ad hoc, then require that to verify.
      - name: Check or apply ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected one .app under release/mac*/, found ${#apps[@]}." >&2
            exit 1
          fi
          app="${apps[0]}"
          if codesign --verify --deep --strict "$app"; then
            echo "Existing signature verifies: $app"
          else
            echo "Signing ad hoc: $app"
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

      # Linux and macOS are archived on the runner. upload-artifact always stores a
      # zip, drops Unix permissions, and follows symlinks, which would break the
      # Linux launcher and the macOS app bundle. Windows is left unpacked: zipping
      # it here would put that zip inside the artifact zip.
      - name: Archive the build
        id: archive
        shell: bash
        env:
          APP_VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          set -eu
          shopt -s nullglob
          arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          mkdir -p release-archive
          case "$RUNNER_OS" in
            Windows)
              name="agent-wars-${APP_VERSION}-windows-${arch}"
              mv release/win-unpacked "release/${name}"
              echo "archive_name=${name}" >> "$GITHUB_OUTPUT"
              echo "archive_path=release/${name}" >> "$GITHUB_OUTPUT"
              ;;
            Linux)
              name="agent-wars-${APP_VERSION}-linux-${arch}"
              mv release/linux-unpacked "release/${name}"
              tar -C release -czf "release-archive/${name}.tar.gz" "${name}"
              ;;
            macOS)
              name="agent-wars-${APP_VERSION}-macos-${arch}"
              apps=(release/mac*/*.app)
              ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "release-archive/${name}.zip"
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          ls -l release-archive

      - name: Upload release archive
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agent-wars-${{ steps.app_version.outputs.value }}-${{ runner.os }}
          path: release-archive/*
          if-no-files-found: error

      # The artifact name is the zip name. upload-artifact creates that zip from
      # the unpacked app, so the Actions download is one zip and not a zip of a zip.
      # Hidden files stay in: the draft-release zip includes them, and the unpacked
      # app can contain dotfiles that are part of the build.
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive_name }}
          path: ${{ steps.archive.outputs.archive_path }}
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: inputs.draft_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: node -e "const fs=require('fs');const v=require('./package.json').version;fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value='+v+String.fromCharCode(10));"

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: agent-wars-${{ steps.app_version.outputs.value }}-*
          path: release-assets

      # Linux and macOS artifacts each hold one archive. The Windows artifact is
      # the unpacked app, so this step zips it once, with files at the zip root,
      # under the artifact's name. found must be 3, one file for each matrix OS.
      - name: Collect release files
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          mkdir -p publish
          found=0
          for dir in release-assets/*; do
            [ -d "$dir" ] || continue
            base="$(basename "$dir")"
            archives=( "$dir"/*.zip "$dir"/*.tar.gz )
            entries=( "$dir"/* )
            if [ "${#archives[@]}" -eq 1 ] && [ "${#entries[@]}" -eq 1 ]; then
              mv "${archives[0]}" publish/
              found=$((found + 1))
              continue
            fi
            if [ "${#archives[@]}" -ne 0 ]; then
              echo "Artifact ${base} mixes an archive with other files." >&2
              exit 1
            fi
            if [ "${#entries[@]}" -eq 0 ]; then
              echo "Artifact ${base} is empty." >&2
              exit 1
            fi
            publish_dir="$PWD/publish"
            (cd "$dir" && zip -r -q "${publish_dir}/${base}.zip" .)
            found=$((found + 1))
          done
          if [ "$found" -ne 3 ]; then
            echo "Expected 3 release files, found ${found}." >&2
            exit 1
          fi
          ls -l publish

      - name: Write checksums
        working-directory: publish
        run: |
          sha256sum agent-wars-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          notes="doc/release-notes/v${APP_VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes not found: $notes" >&2
            exit 1
          fi
          gh release create "v${APP_VERSION}" publish/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Agent Wars ${APP_VERSION}" \
            --notes-file "$notes"