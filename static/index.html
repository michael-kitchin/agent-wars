<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Wars</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="shellChrome.css" />
  <link rel="stylesheet" href="feedbackChrome.css" />
  <link rel="stylesheet" href="overlayChrome.css" />
</head>
<body>
  <div id="canvas-container">
    <div id="main-map" aria-label="World map"></div>
    <canvas id="map-overlay" aria-hidden="true"></canvas>
    <div id="minimap" aria-label="World overview"></div>
    <div id="terrain-legend" aria-label="Terrain legend"></div>
    <div id="hex-tooltip" class="hex-tooltip hidden" aria-hidden="true"></div>
    <div id="order-block-tooltip" class="hex-tooltip order-block-hex-tooltip hidden" aria-hidden="true"></div>
    <div id="order-slower-tooltip" class="hex-tooltip order-slower-hex-tooltip hidden" aria-hidden="true"></div>
    <div id="build-entry-layer" class="build-entry-layer hidden" aria-hidden="true"></div>
    <div id="tactical-entry-layer" class="tactical-entry-layer hidden" aria-hidden="true"></div>
    <div id="build-popup" class="build-popup hidden" aria-hidden="true" role="dialog" aria-label="Build queue">
      <div id="build-popup-body"></div>
    </div>
    <div id="stack-callout" class="stack-callout hidden" aria-label="Units in this hex">
      <ul id="stack-callout-list"></ul>
    </div>
    <div id="game-over-overlay" class="game-over-overlay hidden" aria-live="polite">
      <button type="button" id="new-game-dialog-collapse" class="compact-blue-btn compact-square-btn" aria-expanded="true" aria-controls="game-over-dialog" aria-label="Hide the new game choices" data-control-tooltip="Hide the new game choices. The map stays up.">-</button>
      <div class="game-over-box" id="game-over-dialog">
        <p id="game-over-message"></p>
        <div class="openrouter-tab-bar game-over-tab-bar" role="tablist">
          <button type="button" id="new-game-tab-global" role="tab" aria-selected="true" aria-controls="new-game-panel-global" data-control-tooltip="Start on the world map and pick a home region for each side.">Global</button>
          <button type="button" id="new-game-tab-regional" role="tab" aria-selected="false" aria-controls="new-game-panel-regional" data-control-tooltip="Start on one region and pick a different side group for each player.">Regional</button>
        </div>
        <div id="new-game-panel-global" class="openrouter-tab-panel active" role="tabpanel" aria-labelledby="new-game-tab-global">
        <div class="game-over-region-row">
          <div class="game-over-region-cell">
            <label for="new-game-human-region-select">Human Player:</label>
            <div class="game-over-region-controls">
              <select id="new-game-human-region-select" data-control-tooltip="Pick your side's home region. The opponent may start in the same region."></select>
              <button type="button" id="new-game-human-region-randomize" class="compact-blue-btn compact-square-btn game-over-region-randomize" aria-label="Randomize human home region" data-control-tooltip="Pick one of the listed regions at random for your side, including the region already shown.">↻</button>
            </div>
          </div>
          <div class="game-over-region-cell">
            <label for="new-game-ai-region-select">AI Player:</label>
            <div class="game-over-region-controls">
              <select id="new-game-ai-region-select" data-control-tooltip="Pick the opponent's home region. It may be the same as yours."></select>
              <button type="button" id="new-game-ai-region-randomize" class="compact-blue-btn compact-square-btn compact-opponent-btn game-over-region-randomize" aria-label="Randomize AI home region" data-control-tooltip="Pick one of the listed regions at random for the opponent, including the region already shown.">↻</button>
            </div>
          </div>
        </div>
        </div>
        <div id="new-game-panel-regional" class="openrouter-tab-panel" role="tabpanel" aria-labelledby="new-game-tab-regional" hidden>
          <div class="game-over-regional-region">
            <div class="game-over-region-cell">
              <label for="new-game-region-select">Region:</label>
              <div class="game-over-region-controls">
                <select id="new-game-region-select" data-control-tooltip="Pick the region both sides fight over. Changing it draws two different sides again."></select>
                <button type="button" id="new-game-region-randomize" class="compact-blue-btn compact-square-btn game-over-region-randomize" aria-label="Randomize region" data-control-tooltip="Pick one of the listed regions at random, including the region already shown.">↻</button>
              </div>
            </div>
          </div>
          <div class="game-over-region-row">
            <div class="game-over-region-cell">
              <label for="new-game-human-side-select">Human Player:</label>
              <div class="game-over-region-controls">
                <select id="new-game-human-side-select" data-control-tooltip="Pick your side. It stays different from the opponent's side."></select>
                <button type="button" id="new-game-human-side-randomize" class="compact-blue-btn compact-square-btn game-over-region-randomize" aria-label="Randomize human side" data-control-tooltip="Pick one of the other sides at random for your side.">↻</button>
              </div>
            </div>
            <div class="game-over-region-cell">
              <label for="new-game-ai-side-select">AI Player:</label>
              <div class="game-over-region-controls">
                <select id="new-game-ai-side-select" data-control-tooltip="Pick the opponent's side. It stays different from yours."></select>
                <button type="button" id="new-game-ai-side-randomize" class="compact-blue-btn compact-square-btn compact-opponent-btn game-over-region-randomize" aria-label="Randomize AI side" data-control-tooltip="Pick one of the other sides at random for the opponent.">↻</button>
              </div>
            </div>
          </div>
        </div>
        <div class="game-over-size-row">
          <label for="new-game-size-select">Game size:
            <select id="new-game-size-select" data-control-tooltip="Set how many units each side may field. Small is the baseline, Medium doubles it, and Large triples it, without changing the map or the starting forces.">
              <option value="small" selected>Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </label>
        </div>
        <p id="new-game-advanced-tech" class="game-over-advanced-tech"></p>
        <div class="game-over-size-caps" aria-live="polite">
          <div class="game-over-size-cap">
            <div class="game-over-size-token">
              <img src="units/infantry.svg" alt="" />
              <span id="new-game-size-cap-infantry" class="game-over-size-badge">12</span>
            </div>
            <div class="game-over-size-name">Infantry <span id="new-game-cost-infantry">($20)</span></div>
          </div>
          <div class="game-over-size-cap">
            <div class="game-over-size-token">
              <img src="units/armor.svg" alt="" />
              <span id="new-game-size-cap-armor" class="game-over-size-badge">8</span>
            </div>
            <div class="game-over-size-name">Armor <span id="new-game-cost-armor">($40)</span></div>
          </div>
          <div class="game-over-size-cap">
            <div class="game-over-size-token">
              <img src="units/naval.svg" alt="" />
              <span id="new-game-size-cap-naval" class="game-over-size-badge">8</span>
            </div>
            <div class="game-over-size-name">Naval <span id="new-game-cost-naval">($100)</span></div>
          </div>
          <div class="game-over-size-cap">
            <div class="game-over-size-token">
              <img src="units/air.svg" alt="" />
              <span id="new-game-size-cap-air" class="game-over-size-badge">6</span>
            </div>
            <div class="game-over-size-name">Air <span id="new-game-cost-air">($60)</span></div>
          </div>
        </div>
        <div class="game-over-options">
          <div class="game-over-options-line">
            <label for="new-game-origin-bonus-select">Origin bonus:
              <select id="new-game-origin-bonus-select" data-control-tooltip="Low adds 2 and High adds 4 when a unit fights in the area where it was built: a country in a global game, and the origin area in a regional game.">
                <option value="off">Off</option>
                <option value="low" selected>Low</option>
                <option value="high">High</option>
              </select>
            </label>
            <span class="game-over-options-separator" aria-hidden="true">/</span>
            <label for="new-game-tech-bonus-select">Tech bonus:
              <select id="new-game-tech-bonus-select" data-control-tooltip="Choose Off, Low, or High. Advanced units gain 2 attack at either level, High also adds 2 defense, and Basic units gain nothing.">
                <option value="off">Off</option>
                <option value="low" selected>Low</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>
          <div class="game-over-options-line">
            <label for="new-game-terrain-bonus-select">Terrain bonus:
              <select id="new-game-terrain-bonus-select" data-control-tooltip="In a battle, Low adds 2 and High adds 4 when a unit fights on the terrain where it was built. Off adds nothing, and a unit that also gets the origin bonus receives only the larger of the two.">
                <option value="off">Off</option>
                <option value="low" selected>Low</option>
                <option value="high">High</option>
              </select>
            </label>
            <span class="game-over-options-separator" aria-hidden="true">/</span>
            <label for="new-game-weather-bonus-select">Weather bonus:
              <select id="new-game-weather-bonus-select" data-control-tooltip="Choose Off to ignore weather. Low and High slow movement and cut some attacks for units that lack that weather, and High is the harsher penalty.">
                <option value="off">Off</option>
                <option value="low" selected>Low</option>
                <option value="high">High</option>
              </select>
            </label>
          </div>
        </div>
        <div class="game-over-start-month">
          <label for="new-game-fog-checkbox"><input type="checkbox" id="new-game-fog-checkbox" checked data-control-tooltip="Leave this checked to hide places and enemy units you have not seen. Uncheck it to show the whole map for the next match." /> Fog of war</label>
          <span aria-hidden="true">/</span>
          <label for="new-game-start-month">Starting month:</label>
          <div class="game-over-region-controls">
            <select id="new-game-start-month" data-control-tooltip="Pick the month the match starts in. A global turn is one month. A regional turn is one week, starting on the 1st. Weather changes when the date enters a new month, and a battle stays on the date that is current.">
              <option value="1" selected>January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
            <button type="button" id="new-game-start-month-randomize" class="compact-blue-btn compact-square-btn game-over-region-randomize" aria-label="Randomize starting month" data-control-tooltip="Pick a month at random, including the month already shown.">↻</button>
          </div>
        </div>
        <button type="button" id="new-game-btn" data-control-tooltip="Start the match with the choices on this screen. If the start fails, the screen stays open.">Start game</button>
      </div>
    </div>
    <div
      id="tactical-annihilation-overlay"
      class="game-over-overlay tactical-annihilation-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tactical-annihilation-message"
      aria-live="polite"
    >
      <div class="game-over-box">
        <p id="tactical-annihilation-message"></p>
        <button type="button" id="tactical-annihilation-exit-btn" data-control-tooltip="Close this result and leave the battle. The world-map turn then plays, as it does when you exit during the fight.">Exit Battle</button>
      </div>
    </div>
    <div id="map-toast" class="map-toast hidden" aria-live="polite">
      <p id="map-toast-text"></p>
      <button type="button" id="map-toast-dismiss" aria-label="Dismiss">×</button>
    </div>
    <div id="ai-strategy-toast" class="map-toast ai-strategy-toast hidden" aria-live="polite">
      <p id="ai-strategy-toast-text"></p>
      <button type="button" id="ai-strategy-toast-dismiss" aria-label="Dismiss">×</button>
    </div>
    <div id="tactical-battle-hud" class="tactical-battle-hud hidden" role="group" aria-label="Tactical battle controls" data-control-tooltip="Leave the battle, bring back your world-map orders, and play that turn. The button does nothing while a battle turn is resolving or playing back.">
      <button type="button" id="tactical-exit-btn" class="tactical-exit-btn" aria-label="Exit battle">Exit Battle</button>
    </div>
  </div>
  <aside id="sidebar">
    <div id="sidebar-top">
      <h2 style="margin-top: 0;">Selected hex</h2>
      <p><strong>Game state</strong><br><span id="sidebar-phase">—</span><br><span id="sidebar-turn">—</span></p>
      <p>
        <span class="control-tooltip-host" data-control-tooltip="End this planning step and play out the orders you have queued, on the world map or in a battle. It stays unavailable while the match is over, while the opponent is still planning, or while playback is already running."><button type="button" id="ready-btn" class="ready-btn">Ready</button></span>
        <button type="button" id="ranged-attack-btn" class="ranged-btn" style="display: none;">Ranged</button>
        <select id="air-strike-target-type" class="ranged-btn" style="display: none;" data-control-tooltip="Choose enemy units, production, airports, or seaports. Your next double-click uses that choice until you cancel.">
          <option value="units">Enemy Units</option>
          <option value="urban">Production</option>
          <option value="airport">Airports</option>
          <option value="seaport">Seaports</option>
        </select>
        <button type="button" id="air-strike-cancel-btn" class="ranged-btn" style="display: none;" data-control-tooltip="Stop aiming an air strike and show Strike again. Strikes already in the list stay there.">Cancel</button>
      </p>
      <p><strong>Selected unit</strong><br><span id="sidebar-selected-unit">—</span></p>
      <p><strong>Movement orders</strong></p>
      <div id="pending-orders-list"></div>
      <p><strong>Ranged attacks</strong></p>
      <div id="ranged-attacks-list"></div>
      <p><strong>Air strikes</strong></p>
      <div id="air-strikes-list"></div>
      <p id="sidebar-error" class="chrome-error" style="font-size: 0.9em; display: none;"></p>
    </div>
    <div id="sidebar-bottom">
      <div class="openrouter-tab-bar" role="tablist" aria-label="AI panel">
        <button type="button" id="openrouter-tab-tools" role="tab" aria-selected="false" aria-controls="openrouter-tools-panel" data-control-tooltip="Show the tools the opponent can use, and turn each group on or off.">Tools</button>
        <button type="button" id="openrouter-tab-model" role="tab" aria-selected="true" aria-controls="openrouter-model-panel" data-control-tooltip="Show the API key, model, reasoning effort, and the controls for opponent planning and a new match.">Model</button>
      </div>
      <div id="openrouter-tools-panel" class="openrouter-tab-panel" role="tabpanel" aria-labelledby="openrouter-tab-tools" hidden>
        <div id="openrouter-tools-list" class="openrouter-tools-list"></div>
      </div>
      <div id="openrouter-model-panel" class="openrouter-tab-panel active" role="tabpanel" aria-labelledby="openrouter-tab-model">
        <div class="openrouter-row">
          <label for="openrouter-key">API key</label>
          <div class="openrouter-key-row">
            <input type="password" id="openrouter-key" placeholder="Set key and blur to save" autocomplete="off" data-control-tooltip="Enter your OpenRouter key, then click away or press Enter to save it. The key stays hidden after that; clear the field and leave it to forget the saved key." />
            <span id="openrouter-cost" class="openrouter-cost">$0.00</span>
          </div>
        </div>
        <div class="openrouter-row">
          <label for="openrouter-model">Model</label>
          <div class="openrouter-model-grid">
            <select id="openrouter-model">
              <option value="">— Select model —</option>
            </select>
            <button type="button" id="openrouter-refresh-models" class="openrouter-refresh-btn" aria-label="Refresh model list" data-control-tooltip="Load the model list again. If that fails, the message appears in the AI activity log."></button>
            <span class="control-tooltip-host" data-control-tooltip="Turn opponent planning on or off. Enter an API key and choose a model first."><button type="button" id="openrouter-run-btn" class="openrouter-tool-toggle" aria-pressed="false" disabled>Run</button></span>
            <button type="button" id="openrouter-new-btn" class="openrouter-tool-toggle" aria-label="Start a new game" data-control-tooltip="Open the new-game screen. Opponent planning and any playback stop right away; the current match is replaced when you start the new one.">New</button>
            <span class="control-tooltip-host" data-control-tooltip="Choose how much reasoning this model uses. You only see levels this model offers, its default is marked, and the list stays unavailable when it has fewer than two."><select id="openrouter-reasoning-effort" aria-label="Reasoning effort" disabled>
              <option value="">Model default</option>
            </select></span>
            <div class="openrouter-inline-checkbox openrouter-model-grid-checkbox" data-control-tooltip="Leave this checked if you want Ready to let you fight one melee. Uncheck it to skip that list and resolve melee as Ignore.">
              <input
                type="checkbox"
                id="openrouter-tactical-battles"
                checked
              />
              <label for="openrouter-tactical-battles">Tactical battles</label>
            </div>
          </div>
        </div>
      </div>
      <div class="openrouter-row openrouter-status-row">
        <div id="openrouter-log" class="openrouter-log" aria-label="AI interactions and errors"></div>
      </div>
    </div>
  </aside>
  <div id="model-description-tooltip" class="hex-tooltip model-description-tooltip hidden" aria-hidden="true"></div>
  <div id="control-tooltip" class="hex-tooltip control-tooltip hidden" aria-hidden="true"></div>
  <div id="unit-origin-tooltip" class="hex-tooltip unit-origin-tooltip hidden" aria-hidden="true"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
