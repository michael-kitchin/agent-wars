<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Hex World</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: row;
      font-family: system-ui, sans-serif;
    }
    #canvas-container {
      flex: 1;
      min-width: 0;
      position: relative;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #e8e8e8;
    }
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      padding: 1rem;
      background: #f5f5f5;
      border-left: 1px solid #ccc;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>
  <aside id="sidebar">
    <h2 style="margin-top: 0;">Selected hex</h2>
    <p><strong>H3 index</strong><br><span id="sidebar-h3">—</span></p>
    <p><strong>Cube (x, y, z)</strong><br><span id="sidebar-cube">—</span></p>
    <p><strong>Game state</strong><br><span id="sidebar-phase">—</span><br><span id="sidebar-turn">—</span></p>
    <p><strong>Pending orders</strong></p>
    <div id="pending-orders-list"></div>
    <button type="button" id="ready-btn">Ready</button>
    <p id="sidebar-error" style="color: #c00; font-size: 0.9em; display: none;"></p>
    <p style="color: #666; font-size: 0.9em;">Stage orders for as many units as you like, then Ready. Click unit → destination (same unit again = replace). Cancel below to clear an order.</p>
  </aside>
  <script type="module" src="renderer.js"></script>
</body>
</html>
