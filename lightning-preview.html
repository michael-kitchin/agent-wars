<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lightning bolt preview</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; background: #e0dcd4; }
    h1 { font-size: 1rem; margin: 0 0 0.5rem 0; }
    canvas { display: block; background: #e0dcd4; border: 1px solid #999; }
  </style>
</head>
<body>
  <h1>Combat lightning symbol (from renderer.ts)</h1>
  <canvas id="c" width="120" height="120"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const x = 60, y = 60;
    const h = 18;
    const LIGHTNING_COLOR = '#f0d000';

    ctx.strokeStyle = LIGHTNING_COLOR;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x + 6, y - 4);
    ctx.lineTo(x - 4, y + 6);
    ctx.lineTo(x + 5, y + h);
    ctx.stroke();
  </script>
</body>
</html>
